<body data-page="account">

  <header class="topbar">
    <a class="brand" href="index.html" data-i18n="brand">🎲 桌游规则书</a>
    <span class="topbar-title" data-zh="我的收藏" data-en="My Favorites">我的收藏</span>
  </header>

  <main class="home">
    <!-- 登录 / 注册 -->
    <section class="account-auth" id="auth-view" hidden>
      <div class="auth-card">
        <div class="auth-hero">📚</div>
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-tab="login" data-i18n="loginTab">登录</button>
          <button type="button" class="auth-tab" data-tab="register" data-i18n="registerTab">注册</button>
        </div>

        <form id="login-form" class="auth-form" autocomplete="on">
          <label><span data-i18n="usernameLabel">用户名</span>
            <input name="username" type="text" required maxlength="24" data-i18n-placeholder="loginPhUser" autocomplete="username">
          </label>
          <label><span data-i18n="passwordLabel">密码</span>
            <input name="password" type="password" required maxlength="72" data-i18n-placeholder="loginPhPw" autocomplete="current-password">
          </label>
          <p class="form-error" hidden></p>
          <button type="submit" class="auth-submit" data-i18n="loginSubmit">登录</button>
          <p class="auth-hint"><span data-i18n="noAccount">没有账号？</span><a href="#" data-switch="register" data-i18n="registerLink">注册一个</a><span data-i18n="registerTail">，只需用户名和密码。</span></p>
        </form>

        <form id="register-form" class="auth-form" hidden autocomplete="on">
          <label><span data-i18n="usernameLabel">用户名</span>
            <input name="username" type="text" required minlength="2" maxlength="24" data-i18n-placeholder="regPhUser" autocomplete="username">
          </label>
          <label><span data-i18n="passwordLabel">密码</span>
            <input name="password" type="password" required minlength="8" maxlength="72" data-i18n-placeholder="regPhPw" autocomplete="new-password">
          </label>
          <div class="pw-meter" id="pw-meter" hidden>
            <div class="pw-track"><div class="pw-fill" id="pw-fill"></div></div>
            <span class="pw-text" id="pw-text"></span>
          </div>
          <ul class="pw-rules" id="pw-rules">
            <li data-rule="len" data-i18n="pwRuleLen">8 位以上</li>
            <li data-rule="letter" data-i18n="pwRuleLetter">包含字母</li>
            <li data-rule="digit" data-i18n="pwRuleDigit">包含数字</li>
          </ul>
          <p class="form-error" hidden></p>
          <button type="submit" class="auth-submit" data-i18n="registerSubmit">注册并登录</button>
          <p class="auth-hint"><span data-i18n="hasAccount">已有账号？</span><a href="#" data-switch="login" data-i18n="loginLink">直接登录</a><span data-i18n="dotTail">。</span></p>
        </form>
      </div>
    </section>

    <!-- 收藏清单 -->
    <section class="account-lists" id="lists-view" hidden>
      <div class="account-head">
        <div class="account-head-text">
          <h1 class="account-title" data-i18n="favTitle">📚 我的收藏</h1>
          <p class="account-tip" data-i18n="favTip">在任意游戏页点「已有 / 想买 / 想玩」即可加入对应清单</p>
        </div>
        <div class="account-user">
          <span class="avatar" id="user-avatar" aria-hidden="true"></span>
          <span class="account-username" id="hello-name"></span>
          <button type="button" class="mini-btn account-logout" id="logout-btn" data-i18n="logout">退出</button>
        </div>
      </div>
      <div class="share-panel" id="share-panel" hidden>
        <div class="share-info">
          <span class="share-ico">🔗</span>
          <div>
            <strong data-i18n="shareTitle">分享我的收藏</strong>
            <p id="share-desc" data-i18n="shareDesc">开启后，任何人都可以通过链接查看你的三张清单（只读）</p>
          </div>
        </div>
        <div class="share-off" id="share-off">
          <button type="button" class="mini-btn share-primary" id="share-enable" data-i18n="shareEnable">开启分享</button>
        </div>
        <div class="share-on" id="share-on" hidden>
          <input class="share-link" id="share-link" readonly data-i18n-aria="shareLinkAria" aria-label="分享链接">
          <div class="share-btns">
            <button type="button" class="mini-btn share-primary" id="share-copy" data-i18n="shareCopy">复制链接</button>
            <button type="button" class="mini-btn" id="share-regen" data-i18n="shareRegen">重新生成</button>
            <button type="button" class="mini-btn remove" id="share-disable" data-i18n="shareOff">关闭分享</button>
          </div>
        </div>
      </div>
      <div class="stat-cards" id="account-stats"></div>
      <div id="lists-container"></div>
    </section>

    <footer class="home-footer">
      <p><a href="index.html" data-i18n="backAll">← 返回全部游戏</a></p>
      <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">闽ICP备2026012848号-2</a></p>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/bgg-ratings.js"></script>
  <script src="assets/js/account.js"></script>
  <script>
  (function () {
    "use strict";
    var api = window.RulesAccount.api;
    // 中英切换(i18n.js):文案走字典,langchange 后重渲染清单
    var T = function (key) { return window.ZRulesI18N ? window.ZRulesI18N.t(key) : key; };
    var tErr = function (msg) { return window.ZRulesI18N ? window.ZRulesI18N.tErr(msg) : msg; };
    var langEn = function () { return !!window.ZRulesI18N && window.ZRulesI18N.lang() === "en"; };
    var STATUS_LABEL_KEY = { owned: "stOwned", wishlist: "stWishlist", play: "stPlay" };
    var statusLabel = function (s) { return T(STATUS_LABEL_KEY[s]); };
    var STATUS_KEYS = ["owned", "wishlist", "play"];
    var SECTION_META = [
      { key: "owned", ico: "✅", titleKey: "secOwned", emptyKey: "emptyOwned" },
      { key: "wishlist", ico: "🛒", titleKey: "secWishlist", emptyKey: "emptyWishlist" },
      { key: "play", ico: "🎲", titleKey: "secPlay", emptyKey: "emptyPlay" }
    ];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function fmtUsers(n) {
      n = Number(n) || 0;
      if (langEn()) return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + "K" : String(n);
      return n >= 10000 ? (n / 10000).toFixed(1) + "万" : String(n);
    }

    // ?next= 登录后回跳（只允许站内路径，防开放重定向）
    function nextTarget() {
      var next = new URLSearchParams(location.search).get("next");
      if (next && next.charAt(0) === "/" && next.charAt(1) !== "/") return next;
      return null;
    }

    function gameHref(key) {
      var i = key.indexOf("/");
      return i < 0 ? "games/" + key + ".html" : "games/" + key.slice(0, i) + "/" + key.slice(i + 1) + ".html";
    }

    function bggChip(key) {
      var R = window.BGG_RATINGS || {};
      var r = R[key] || R[key.replace("bga/", "")];
      if (!r) return "";
      return '<span class="meta-chip bgg-chip-mini" title="' +
        esc(T("bggChipTitle").replace("{a}", r.a).replace("{r}", r.r).replace("{w}", r.w).replace("{u}", fmtUsers(r.u))) +
        '">⭐' + esc(r.a) + " · " + esc(T("wLabel")) + " " + esc(r.w) + "</span>";
    }

    /* ---------- 视图切换 ---------- */
    var authView = document.getElementById("auth-view");
    var listsView = document.getElementById("lists-view");

    function showAuth() { authView.hidden = false; listsView.hidden = true; }
    function showLists(user) {
      authView.hidden = true;
      listsView.hidden = false;
      document.getElementById("hello-name").textContent = user.username;
      var ch = (user.username.trim().charAt(0) || "?").toUpperCase();
      document.getElementById("user-avatar").textContent = ch;
      loadLists();
      loadShare();
    }

    /* ---------- 分享 ---------- */
    var sharePanel = document.getElementById("share-panel");

    function shareURL(token) {
      return location.origin + "/shared.html?t=" + token;
    }

    function renderShare(st) {
      sharePanel.hidden = false;
      document.getElementById("share-off").hidden = st.enabled;
      document.getElementById("share-on").hidden = !st.enabled;
      if (st.enabled) {
        document.getElementById("share-link").value = shareURL(st.token);
      }
    }

    function loadShare() {
      api("GET", "/share").then(renderShare).catch(function () { /* 面板保持隐藏 */ });
    }

    function flashBtn(btn, text) {
      var orig = btn.textContent;
      btn.textContent = text;
      btn.disabled = true;
      setTimeout(function () { btn.textContent = orig; btn.disabled = false; }, 1600);
    }

    document.getElementById("share-enable").addEventListener("click", function () {
      api("POST", "/share").then(renderShare).catch(function (err) { window.alert(T("enableFail") + tErr(err.message)); });
    });
    document.getElementById("share-regen").addEventListener("click", function () {
      if (!window.confirm(T("regenConfirm"))) return;
      api("POST", "/share").then(renderShare).catch(function (err) { window.alert(T("opFail") + tErr(err.message)); });
    });
    document.getElementById("share-disable").addEventListener("click", function () {
      if (!window.confirm(T("shareOffConfirm"))) return;
      api("DELETE", "/share").then(function () { renderShare({ enabled: false }); })
        .catch(function (err) { window.alert(T("closeFail") + tErr(err.message)); });
    });
    document.getElementById("share-copy").addEventListener("click", function () {
      var input = document.getElementById("share-link");
      var btn = this;
      var done = function () { flashBtn(btn, T("copied")); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).then(done, function () { fallbackCopy(input, done); });
      } else {
        fallbackCopy(input, done);
      }
    });
    function fallbackCopy(input, done) {
      input.select();
      try { document.execCommand("copy"); done(); } catch (e) { window.prompt(T("manualCopy"), input.value); }
    }

    /* ---------- 清单渲染 ---------- */
    var lastListData = null;
    function loadLists() {
      api("GET", "/collection").then(function (data) { lastListData = data; renderLists(data); })
        .catch(function () { showAuth(); });
    }

    function renderLists(data) {
      document.getElementById("account-stats").innerHTML = SECTION_META.map(function (sec) {
        var n = data.counts[sec.key] || 0;
        return '<a class="stat-card st-' + sec.key + '" href="#list-' + sec.key + '">' +
          '<span class="stat-num">' + n + "</span>" +
          '<span class="stat-label">' + sec.ico + " " + esc(T(sec.titleKey)) + "</span></a>";
      }).join("");

      var html = "";
      SECTION_META.forEach(function (sec) {
        var items = data[sec.key] || [];
        html += '<section class="list-block st-' + sec.key + '" id="list-' + sec.key + '">' +
          '<h2 class="list-title">' + sec.ico + " " + esc(T(sec.titleKey)) +
          '<span class="count-badge">' + items.length + "</span></h2>";
        if (!items.length) {
          html += '<div class="list-empty"><span class="le-ico">' + sec.ico + "</span>" +
            "<p>" + esc(T(sec.emptyKey)) + '</p><a class="le-link" href="index.html">' + esc(T("goIndex")) + "</a></div>";
        } else {
          html += '<div class="list-rows">';
          items.forEach(function (it) {
            // 单语言名:英文模式显示英文名(缺失回退中文名),中文模式显示中文名
            var nm = langEn() ? (it.en || it.name) : (it.name || it.en);
            html += '<div class="list-row" data-key="' + esc(it.game_key) +
              '" data-name="' + esc(it.name || "") + '" data-en="' + esc(it.en || "") + '">' +
              '<div class="list-info"><a class="list-name" href="' + esc(gameHref(it.game_key)) + '">' +
              esc(nm) + "</a>" +
              bggChip(it.game_key) + "</div>" +
              '<div class="list-actions">' +
              STATUS_KEYS.map(function (k) {
                return '<button type="button" class="mini-btn' + (k === it.status ? " active" : "") +
                  '" data-move="' + k + '" title="' + esc(T("moveTitle").replace("{s}", statusLabel(k))) + '">' + esc(statusLabel(k)) + "</button>";
              }).join("") +
              '<button type="button" class="mini-btn remove" data-move="" title="' + esc(T("removeTitle")) + '">✕</button>' +
              "</div></div>";
          });
          html += "</div>";
        }
        html += "</section>";
      });
      document.getElementById("lists-container").innerHTML = html;
    }

    // 语言切换后按新语言重渲染清单(静态文案由 i18n.js applyChrome 处理)
    document.addEventListener("zrules:langchange", function () {
      if (lastListData) renderLists(lastListData);
    });

    // 事件委托：移动 / 移除(双语名从 data-* 原样回传,不随当前显示语言改写)
    document.getElementById("lists-container").addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-move]");
      if (!btn) return;
      var row = btn.closest(".list-row");
      var key = row && row.dataset.key;
      if (!key) return;
      api("PUT", "/collection/" + key, {
        status: btn.dataset.move,
        name: (row.dataset.name || row.querySelector(".list-name").textContent).slice(0, 60),
        en: (row.dataset.en || "").slice(0, 80)
      })
        .then(loadLists)
        .catch(function (err) { window.alert(T("opFail") + tErr(err.message)); });
    });

    document.getElementById("logout-btn").addEventListener("click", function () {
      api("POST", "/logout").then(function () { location.href = "index.html"; });
    });

    /* ---------- 登录 / 注册 ---------- */
    var tabs = document.querySelectorAll(".auth-tab");
    function switchTab(name) {
      tabs.forEach(function (t) { t.classList.toggle("active", t.dataset.tab === name); });
      document.getElementById("login-form").hidden = name !== "login";
      document.getElementById("register-form").hidden = name !== "register";
    }
    tabs.forEach(function (t) {
      t.addEventListener("click", function () { switchTab(t.dataset.tab); });
    });
    document.querySelectorAll("[data-switch]").forEach(function (a) {
      a.addEventListener("click", function (ev) { ev.preventDefault(); switchTab(a.dataset.switch); });
    });

    function bindForm(formId, path) {
      var form = document.getElementById(formId);
      var errEl = form.querySelector(".form-error");
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        errEl.hidden = true;
        var username = form.username.value.trim();
        var password = form.password.value;
        var btn = form.querySelector(".auth-submit");
        btn.disabled = true;
        api("POST", path, { username: username, password: password }).then(function (user) {
          var next = nextTarget();
          location.href = next || "/account.html";
        }).catch(function (err) {
          errEl.textContent = tErr(err.message);
          errEl.hidden = false;
          btn.disabled = false;
        });
      });
    }
    bindForm("login-form", "/login");
    bindForm("register-form", "/register");

    /* ---------- 注册密码强度实时反馈 ---------- */
    var pwInput = document.querySelector('#register-form input[name="password"]');
    var pwMeter = document.getElementById("pw-meter");
    var pwFill = document.getElementById("pw-fill");
    var pwText = document.getElementById("pw-text");
    var pwRules = document.querySelectorAll("#pw-rules li");

    pwInput.addEventListener("input", function () {
      var v = pwInput.value;
      pwMeter.hidden = !v;
      var okLen = v.length >= 8;
      var okLetter = /[a-zA-Z\u4e00-\u9fff]/.test(v);
      var okDigit = /\d/.test(v);
      pwRules.forEach(function (li) {
        var ok = li.dataset.rule === "len" ? okLen : li.dataset.rule === "letter" ? okLetter : okDigit;
        li.classList.toggle("ok", ok);
        li.classList.toggle("bad", !!v && !ok);
      });
      if (!v) { pwFill.style.width = "0%"; pwText.textContent = ""; return; }
      var score = 0;
      if (okLen) score++;
      if (okLetter && okDigit) score++;
      if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
      if (/[^a-zA-Z0-9\u4e00-\u9fff]/.test(v)) score++;
      if (v.length >= 12) score++;
      var level = score <= 2 ? [T("pwWeak"), 33, ""] : score === 3 ? [T("pwMid"), 66, "mid"] : [T("pwStrong"), 100, "strong"];
      pwFill.style.width = level[1] + "%";
      pwFill.className = "pw-fill " + level[2];
      pwText.textContent = T("pwStrength") + level[0];
    });

    /* ---------- 启动 ---------- */
    api("GET", "/me").then(showLists).catch(showAuth);
  })();
  </script>
</body>
