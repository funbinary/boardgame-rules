<script>Gamefound.registerComponent('v-a279617f-665c-40b2-8061-9b2918b74dba', 'Components.Projects.ProjectUpdate', Gamefound.Components.Projects.ProjectUpdate, {"props":{"showContent":true,"update":{"userInfo":null,"abstract":"Let\u0027s start this incredible journey together! It will be crowned by the special version of one of the best games in the world. Together with you, we will create an edition that will pay tribute to this unique title!","content":"\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EHello Dukes \u0026amp; Duchesses!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003ELet\u0027s start with saying WOW! Over 23.000 board gamers are already following our campaign\u0027s draft page! That\u0027s awesome! We are extremely happy to have you here with us! \u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EWe have been looking very carefully through the comment section throughout the last few days, and we are delighted with your ideas!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003ECastles of Burgundy is one of the best board games ever, and with this special version, we want to pay our tribute to this title. \u003C/b\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EAnd we cannot imagine a situation in which we will not involve you, players who have spent many hours with this game and know best how to add even more royal shine to it!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EDuring the campaign, and even before its start, thanks to Gamefound\u0027s special pre-campaign updates, we will want to show you our ideas for Quality of Life upgrades and ask your opinion during many votes.\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EToday we want to focus on the art of hex tiles and ask you for your opinion in the first vote :)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EBut before we go to the vote, here are a few words of explanation from us.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EFirst of all, we love all the proposals that we are going to present to you :) Each of them was designed by our artists with love, and now we want to ask you about it. So there are no concepts here that we assume in advance will not be selected. \u003C/span\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003ETo be honest, we would include all of them in the final version if that was possible :D Each of them has been developed to add even more flavor to Castles of Burgundy, and it will be up to you to decide which one will be in the final special version!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003ESecondly, all component improvements that we want to offer you will be thoroughly checked by our testers during countless games that will be played before and during the campaign:) \u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003EThis means, that we are testing materials, sizes and majority of the things that we are going to offer in the special edition in a real-life gameplay, to make sure it actually improves the experience. \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/f9668fa5-bf50-4de3-9a3b-3208af587e66.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EAnd this way, we come to the already mentioned hex tiles. \u003C/span\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EIn addition to the new art styles you will choose today, we can reveal the first secret and say that we will undoubtedly enlarge these hexes a bit. \u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EYou can see the quick prototype we have done to check how those different sizes will behave at real gameplay and tabletop presence. We generally want to make sure the visibility of the game will be better and you will be able to easy see what is what on the table (including icons etc.). \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EHow much exactly? It\u0027s still a matter of testing and optimizing components, right now we are looking at around 30%. We want it to be the most ergonomic solution that will not only increase the comfort of the gameplay but also will not cause the Castles of Burgundy to require much more space on your shelves ;) \u003Cb\u003EW\u003C/b\u003E\u003C/span\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003Ee also read your comments very carefully and hexes were a big part of them and we are looking at \u003C/b\u003E\u003Cb\u003Epossibility\u003C/b\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E of some other \u003C/b\u003E\u003Cb\u003Eimprovements\u003C/b\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u003Cb\u003E! :)\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/f686ad73-8473-4740-96f3-2d9b3e673731.jpg\u0022\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EIn the photo above you can see the potential new size of the tiles. Please notice that in this example we are using the hex design from the previous version of the game, in an absolute quick prototype to see different possibilities. \u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EOkay, it\u0027s time for today\u0027s icing on the cake. Time to vote!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EBelow you will find three of our proposed art styles that we believe can add to the royal splendor of the special edition.\u003C/b\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E As already mentioned, all of them came from the hands of our talented artists. We love each of them, so we ask you for help choosing the one that best suits the Castles of Burgundy! :) Please notice that you are voting only on the art style! The UI will be revealed later.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003ERemember, there are no wrong choices here ;) We are sure that together, we will be able to create a unique version of a fantastic game that has won the hearts of millions of players worldwide!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/b45556ee-16a3-4942-8b1b-eb1f9c69cfed.jpg\u0022\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EAnd today is just the beginning of this epic journey, so stay tuned!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EThere are still many royal moments ahead of us!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003E\u003Cb\u003EDon\u0027t forget to vote, and we\u0027ll see you in the next pre-campaign update!\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: Calibri, sans-serif\u0022\u003EAnd of course, we are all the time waiting for your ideas about what you would like to see in the CoB special version! Let us know in the comments using \u003Cb\u003E#deluxeBurgundy\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E","hasImage":true,"imageUrl":"https://imgcdn.gamefound.com/projectupdate/projects/1926/87598040-ea40-4b9c-a75e-a534941d551a.jpg","targetAudience":0,"targetUserGroupIDs":null,"projectUpdateUrl":null,"bulkNotificationID":null,"createdAt":"2022-04-12T13:15:34.087Z","imageFileName":"87598040-ea40-4b9c-a75e-a534941d551a.jpg","isPinned":false,"isPublished":true,"likesCount":836,"pollID":118,"projectID":1926,"projectUpdateID":1789,"publishedAt":"2022-04-12T17:30:25.213Z","sequenceNumber":1,"status":1,"title":"Pre-campaign update #1: Time to start this journey! The first community vote begins today!","updatedAt":null},"isLoggedIn":false},"class":null});</script>
