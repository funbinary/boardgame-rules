<script>Gamefound.registerComponent('v-3629589a-daae-48bf-9df0-b29471aebef6', 'Components.Projects.ProjectUpdate', Gamefound.Components.Projects.ProjectUpdate, {"props":{"showContent":true,"update":{"userInfo":null,"abstract":"Today we have a BIG Stretch Goal! We present the Automa created for the Special Edition of Castles of Burgundy by David Turczi and his team! This will hugely extend the replayability and experience for solo players!","content":"\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EHello Dukes \u0026amp; Duchesses!\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EThe finish line of our campaign is getting closer each passing day. Still, we continue the journey, and today we want to unlock a really BIG Stretch Goal! Mainly we present an advanced solo mode for CoB created by David Turczi and his team - the praise specifically should go to John Albertson and Nick Shaw, who are the lead designers of this solo mode!\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/ce08d64d-170e-45e7-85ac-cfa42af16849.jpg\u0022\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003ELater in the update, you will find a few words from John and Nick, but let\u0027s have a quick glance at the most important information about this Automa.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EFirst of all, it opens a totally new experience for solo players. Until now, Castles of Burgundy had one mini-expansion that presented a double-sided board that allowed players to play solo on that specific board. All other Duchies were unavailable for a one-player game. With today\u0027s Stretch Goal, you will be able to play with the Automa on almost all available Duchies!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EFor obvious reasons, it will not fit the existing solo board and the Team Play expansion. On the other hand, all other Duchies will be compatible with our advanced solo mode, which will significantly increase the replayability and possibilities that the Special Edition of CoB will have to offer solo players! And you are getting it correctly, Dukes \u0026amp; Duchesses! The Automa will also be compatible with the new big expansion created by Stefan Feld \u2013 The Vineyards of Burgundy!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EThe Automa will introduce to the game a special Automa board, 17 new cards (County cards), and 1 additional A5-sized help sheet with some key rules to make the play easier and quicker! We are still working with John, Nick, and David on polishing the final rules. We will be surely posting them in one of our post-campaign updates :) But for those of you who aren\u0027t familiar with David Turczi and his team, we can assure you that they definitely know what they are doing as they specialize in creating solo rules, and have done so for over three dozen games.\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/4a5bcf88-ccf8-4d97-9a82-467df104275b.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EJohn and Nick also wrote down a few words about the design process that we want to share with you :) They will also highlight the whole Automa a bit more while we still keep working on the final rules. So, we leave the floor to them:\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ci style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EJohn:\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ci style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EThe first step in designing a solo mode for a multiplayer game is to start with a great multiplayer game. CoB has that part well covered. The second step is to find a good co-creator. I immediately volunteered Nick Shaw because I knew CoB was his favorite, and we hadn\u0027t worked on a project together for a while. The next step is to figure out which interactions you want to simulate. Once those interactions are decided, a method to implement them is next. Then it\u0027s time for several rounds of iterating and testing and iterating and testing until it\u0027s ready to be handed over to the publisher.\u0026nbsp;\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ci style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EIt will help if you know what the special board for the \u0022automated solo opponent\u0022 (hereafter called \u0022the bot\u0022) looks like in its current, but not yet final, form. It has areas found on the typical player board (Goods tiles, silver coins, a Duchy) and two new areas - Reserve and County cards. The Reserve holds tiles the bot takes as a result of other tiles\u0027 placement. For example, when placing a Market, the extra Ship or Livestock the bot gains are placed in the Reserve. The County cards area will be discussed in a separate update after the campaign once we have the final rules ready.\u0026nbsp;\u0026nbsp;\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ci style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003ENick:\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ci style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EThe expansions from the Anniversary Edition are mostly mini-expansions that just needed minor rules tweaks. So they were easy to put in solo support for, some were a little larger, which required a bit more testing, but on the whole, these were simple enough to adapt for the solo Automa to support. We added some icons on the County cards to trigger certain effects for the Border Posts and Shields expansions. Still, only minor rules notes were required to add support for all the mini-expansions. The Team variant and the Solo variant boards were beyond the scope of converting. The Team variant had no need for solo support. The Solo variant board was obviously not solo compatible. You had no opponent - plus, you could already play them solo, so you didn\u0027t need us there.\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ci style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ci style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EAt some point in our work Awaken Realms revealed the Vineyards expansion to us. We had to work out if we could and how to support that one within a fairly tight timeframe. John and I went back and forth on ideas of how to do this, and John tested a few and finally settled on what eventually became the ruleset we used\u2026\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EWe will surely get back to John and Nick once more and will ask them to share more insights from the designing process once the rules are finished and made available for you all :)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EExternal tests of the Automa!\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003ELast but not least, we have a special announcement for you all! It may sound a bit familiar, but this time it is directed to solo players :)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EWith the new Automa on board, we plan to prepare a few prototypes for external blind test purposes! And we are looking for solo players who:\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E- have a copy of The Castles Burgundy or can have good access to one (preferred Anniversary edition)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E- play a lot games solo and have experience in this subject\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003ESo, if you meet the above requirements, have some free time, would like to take part in testing the Automa for CoB, and provide us with feedback, this may be your lucky day ;) If you want to apply, \u003C/span\u003E\u003Ca href=\u0022https://docs.google.com/forms/d/e/1FAIpQLSegXc_lAT1cxSng1grphqYhy8sk3tpEfkcnSXtwEvi2Y-v6Kw/viewform?usp=send_form\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer       \u0022\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003Eplease fill out this survey.\u003C/span\u003E\u003C/a\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EPlease notice that we will cooperate only with a few chosen testers that will receive the prototype from us.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003EIn the meantime, we are entering the last days of our journey! And still, we have one more bi-daily Stretch Goal ahead of us! So, right now, we wish you all a great weekend with some board games :) And we\u0027ll see each with the next update!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1); font-family: \u0026quot;Times New Roman\u0026quot;, serif\u0022\u003ETake care!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E","hasImage":true,"imageUrl":"https://imgcdn.gamefound.com/projectupdate/projects/1926/109d6c19-ea90-42de-8040-71eeeca37eb8.jpg","targetAudience":0,"targetUserGroupIDs":null,"projectUpdateUrl":null,"bulkNotificationID":null,"createdAt":"2022-06-11T08:10:17.213Z","imageFileName":"109d6c19-ea90-42de-8040-71eeeca37eb8.jpg","isPinned":false,"isPublished":true,"likesCount":210,"pollID":null,"projectID":1926,"projectUpdateID":2315,"publishedAt":"2022-06-11T13:54:18.403Z","sequenceNumber":15,"status":1,"title":"Day 19: BIG Stretch Goal unlock \u2013 Automa for the Special Edition of Castles of Burgundy!","updatedAt":null},"isLoggedIn":false},"class":null});</script>
