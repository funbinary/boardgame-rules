    <script>
        (function (){
            const localStorageValue = JSON.parse(localStorage.getItem('store.webTheme'));
            if (localStorageValue && localStorageValue.theme) {
                document.documentElement.setAttribute('data-theme', localStorageValue.theme);
            }
            else {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
                else {
                    document.documentElement.setAttribute('data-theme', 'bright');
                }
            }
        })();
    </script>

<div id="v-f766f66b-6437-4e31-8327-0439c17c0e43"></div>
    <script>App.registerComponent('v-f766f66b-6437-4e31-8327-0439c17c0e43', 'App.Components.Projects.ProjectUpdateContent', App.Components.Projects.ProjectUpdateContent, {"props":{"navigation":{"backProjectUrl":null,"items":[{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Project","restrictionReason":null,"type":0,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Rewards","restrictionReason":null,"type":1,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/rewards"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Your pledge","restrictionReason":null,"type":2,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/yourpledge"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Comments","restrictionReason":"The creator hasn\u0027t enabled the comment section yet.","type":3,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/comments"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":true,"isRestricted":false,"name":"Updates","restrictionReason":"","type":4,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"FAQ","restrictionReason":"The creator hasn\u0027t enabled the FAQ section yet.","type":5,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/faq"}],"stretchGoalsUrl":null},"update":{"userInfo":null,"abstract":"Check out the redesigned double-layered player boards that have been changed, thanks to the feedback from our external tests groups!","content":"\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EHello Dukes \u0026amp; Duchesses!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003EThis month we are back with some news about the feedback we gathered during the first round of external tests, which we mentioned last month. It was an extremely productive time as all the groups provided valuable information regarding all the components. We have already started implementing their feedback, and \u003Cb\u003Etoday we want to show you one key element that has been redesigned \u2013 the player boards!\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EBefore we show you the image of the current version, let\u0027s quickly describe all the changes we have presented to the player boards.\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EFirst of all, for players\u0027 convenience, we moved Hex tiles slot and Dice slots to the right side of the player board.\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003EIn addition, we\u0027ve added extra \u0027finger slots\u0027 to make removing and inserting Hexes and Trade Goods easier.\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003EOn top of that, we also made other changes that turned out to be very well received by testers during the next round of testing. Namely, we have widened the Worker slot so that players do not have to stack them on top of each other.\u003C/div\u003E\u003Cdiv\u003EWe have also added a field for Bonus tiles to the board\u0027s right side.\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EWe have separated \u0022active dice slots\u0022 from \u0022used dice slots\u0022 for better usability and to avoid mistakes.\u003C/b\u003E In addition, we added a white die slot as testers pointed out that there was no space for it. Now you can easily determine who started the round and where the white die is located. During testing, players noted that they often had to search for this die around the board.\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EWe have removed the space for sold goods from the board. The sold goods are now placed below the board, which is also indicated by the bottom left icon.\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EFinally, we moved the Hex Storage to the right\u003C/b\u003E. We corrected its shape to match regular and double hexes from the Vineyards expansion.\u0026nbsp; \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003ESo once you now know all the changes in detail, it\u0027s time to take a look at how the current version looks\u003C/b\u003E :) Of course, please consider this still a work in progress component as we still have one round of external tests ahead of us.\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/ed170d5f-ee35-4bb1-a9a0-601523b21969.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/0a49ac6b-9798-4c37-a572-22fc638ce449.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/90aed39c-e44f-41b2-b152-19f03c10f351.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/f67a4fdd-fc63-4a19-9b3a-4bc333bd1466.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003EAs mentioned, we are preparing one final round of external tests. During them, we will be willing to gather the final feedback about the usability of all the new or corrected components and the rulebooks.\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003ESo, next month we should be back with more news about the main board and other changed elements :) \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003ETake care!\u003C/div\u003E","hasImage":true,"imageUrl":"https://imgcdn.gamefound.com/projectupdate/projects/1926/d79e3498-dcf3-4fa6-9713-b5e4d9c5d2db.jpg","targetAudience":0,"targetUserGroupIDs":null,"projectUpdateUrl":null,"previousUpdateUrl":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates/19","nextUpdateUrl":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates/21","bulkNotificationID":null,"createdAt":"2022-08-23T12:36:41.57Z","imageFileName":"d79e3498-dcf3-4fa6-9713-b5e4d9c5d2db.jpg","isPinned":false,"isPublished":true,"likesCount":346,"pollID":null,"projectID":1926,"projectUpdateID":2926,"publishedAt":"2022-08-23T16:02:13.373Z","sequenceNumber":20,"sendNotificationsForScheduledProjectUpdate":false,"status":1,"title":"Development update #1 / Redesigned player boards are here!","updatedAt":"2022-08-23T16:53:32.757Z"},"isLoggedIn":false,"showComments":true,"comments":{"allowCreatorHidingComments":true,"commentThreadID":1568,"hideCommentsOnMobile":false,"tag":null,"tagRedirectUrl":null,"showRecommendations":false,"showStreams":false,"layout":"default","loading":"lazy","canComment":false},"goBackUrl":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates","goBackLabel":"go back to updates","projectId":1926}});</script>
