<script>Gamefound.registerComponent('v-0b18e9f3-bff3-4590-85bb-839f50c36412', 'Components.Projects.ProjectUpdate', Gamefound.Components.Projects.ProjectUpdate, {"props":{"showContent":true,"update":{"userInfo":null,"abstract":"Today we present a unique add-on that transforms your Duchy into a 3d kingdom! We also add a new pledge level with this unique item onboard \u2013 the Majestic Pledge.","content":"\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EHello Dukes \u0026amp; Duchesses!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EBIG day today as we will reveal the biggest add-on of our campaign! Besides that, we will unlock our new Stretch Goal, which addresses a topic you have been discussing in the comment section for a while! So, without further ado, let\u0027s move straight forward and check out our today\u0027s surprises!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003ENew Stretch Goal unlock\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ELet\u0027s start with unlocking today\u0027s Stretch Goal. This one is the one you have been quite often asking about, and for obvious reasons, we couldn\u0027t answer as it would spoil the surprise ;) But the day has come, and we can finally speak freely now!\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EWe are upgrading the Trade goods tokens! :)\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/5d8360a3-1200-4845-9bda-0ff5e38b3295.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EThis version will be produced from high-quality wood. To be exact, it will be crafted from the New Zeeland Pine, also known as Radiata Pine.\u003C/b\u003E This is a premium raw material that is highly durable, allowing the token properties to be maintained over hundreds of CoB games :) The graphics will be heat transferred, providing them with a premium look and durability.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EPlease notice that these new premium wood tokens will replace the cardboard ones in all pledges.\u003C/b\u003E Additionally, the final wood color may differ from the one presented as we are still waiting for the final samples of the wood material.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003ENew sketch for the Victory Points standee/mini\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EToday we also want to present you with a change that we have presented to one of the Victory point markers. At this point, we would also like to thank you for the constructive feedback we received after publishing the VP marker update!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/c941f7a7-9b9f-4cb7-bd0e-2b557c5d22dd.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EThis one will replace the yellow duke shown on the Day 11 update.\u003C/b\u003E Thanks to this change, we will now have two minis/standees representing women and two representing men. \u003Cb\u003EOf course, we will present you both the standee (for the Classic pledge) and the miniature (for the other pledges) in one of the future updates after the campaign. Our 2d and 3d artists just need a bit more time to prepare the proper graphics.\u003C/b\u003E However, we wanted to present you with this change during the campaign, so we managed to prepare this sketch extra for today!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003ENew add-on is available! Time for a 3d terrain pack!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EIt\u0027s time to reveal our BIG add-on for the Special Edition of The Castles of Burgundy! \u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EWe prepared an exclusive Terrain Pack containing 3d miniatures of all available hex tiles!\u003C/b\u003E It will come in a separate box with a dedicated high-quality insert that will include storage solutions to make the setup and gameplay highly accessible. \u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EWith this 3d pack, you will receive 159 beautiful miniatures representing all hex tiles from the game (the castle 3d minis are already included in the Special Edition box)\u003C/b\u003E. \u003C/span\u003EJust to be straightforward with you, let\u0027s emphasize that this is a purely cosmetic add-on with no gameplay value. You don\u0027t need it to play the Special Edition of The Castles of Burgundy. But it looks pretty cool on the table, thou ;)\u003C/div\u003E\u003Cdiv\u003E\u003Ca href=\u0022https://gamefound.com/projects/awaken-realms/castles-of-burgundy-special-edition#/product/26446\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/9b8c9b0d-1e68-4372-8ce9-52e582779156.jpg\u0022\u003E\u003C/a\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EAll the 3d tiles will be in a color corresponding to their traditional counterparts to be easily distinguished from one another.\u003C/b\u003E\u0026nbsp;\u003Cb\u003EWe are still working on the final colors of all tiles, including the livestock tiles that will have the same base, but different animal colors\u003C/b\u003E.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EWe emphasize ensuring that you can easily tell them apart, not only by their shape. Of course, the design is not final in terms of graphics and colors, but this add-on will surely take the visual side of CoB to another level! With this Terrain Pack, you will literally have the possibility to build your beautiful 3d kingdom!\u003Cb\u003E The size of the base of the minis will be the same as in hex tiles, so the figures will fit perfectly into the overlay spots on your player board. \u003C/b\u003ETheir height will also be adjusted to ensure the best possible usability and gameplay.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EThe minis are designed to replace the hex tiles used in the basic game. During the game, however, hexes are still used. Players replace them with figures only on their Duchies. \u003Cb\u003EIn addition to giving each Duchy a new 3d look, we also want to ensure the functionality of such a solution. A special dedicated board will be added to this add-on. It will fit the double-layered player board and will be used to store the cardboard/acrylic Monastery hexes that should be placed on your Duchy.\u003C/b\u003E Thanks to that, you will be able to recognize the advantages offered by the 3d monasteries that you will have in your Duchy.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ca href=\u0022https://gamefound.com/projects/awaken-realms/castles-of-burgundy-special-edition#/product/26446\u0022\u003EYou can choose to add the standard version (without Sundrop) of the 3d Terrain Pack as a separate add-on to your pledge\u003C/a\u003E. \u003Cb\u003EIn that version, all the terrains will also have different colors\u003C/b\u003E. \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EIf you would be interested in receiving the terrains with our Sundrop pre-wash, you should check out the new pledge below :)\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EMajestic pledge\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EWith the 3d Terrain Pack add-on on board, we prepared a new pledge level for you, Dukes \u0026amp; Duchesses!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003E\u003Ca href=\u0022https://gamefound.com/projects/awaken-realms/castles-of-burgundy-special-edition#/product/26447\u0022\u003EToday we present you the Majestic pledge!\u003C/a\u003E\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ca href=\u0022https://gamefound.com/projects/awaken-realms/castles-of-burgundy-special-edition#/product/26447\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/45aa9be6-efa4-445d-acb9-4afb80d87e70.jpg\u0022\u003E\u003C/a\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EIt will contain all the components known from the already available Royal pledge. So you will find the Special Edition box \u002B Stretch Goals, set of Upgraded acrylic hex tiles, the playmat, and our Sundrop pre-wash added to the castle minis. And additionally, the Majestic pledge will also include the 3d Terrain Pack with Sundrop effect!\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/c5e86ad7-63d6-4695-ac91-9a8d3f7c8671.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003E\u003Ca href=\u0022https://gamefound.com/projects/awaken-realms/castles-of-burgundy-special-edition#/product/26447\u0022\u003EYou can check out the details HERE\u003C/a\u003E!\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAnd that\u0027s all we prepared for this update! As always, thanks for being here with us and taking part in this journey!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EThere is still some route in front of us, so we will be back on Saturday with a new Stretch Goal :)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ETake care!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E","hasImage":true,"imageUrl":"https://imgcdn.gamefound.com/projectupdate/projects/1926/f4facd9e-1b66-4821-8072-0e9c6ddbd1a4.jpg","targetAudience":0,"targetUserGroupIDs":null,"projectUpdateUrl":null,"bulkNotificationID":null,"createdAt":"2022-06-09T06:45:26.913Z","imageFileName":"f4facd9e-1b66-4821-8072-0e9c6ddbd1a4.jpg","isPinned":false,"isPublished":true,"likesCount":225,"pollID":null,"projectID":1926,"projectUpdateID":2299,"publishedAt":"2022-06-09T17:45:16.17Z","sequenceNumber":13,"status":1,"title":"Day 17: 3d Terrain pack add-on is here! Also, check out the new Majestic Pledge!","updatedAt":"2022-06-09T18:04:54.193Z"},"isLoggedIn":false},"class":null});</script>
