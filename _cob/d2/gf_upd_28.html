<script>Gamefound.registerComponent('v-99870897-917b-411c-94f6-8d8fa37d6eae', 'Components.Projects.ProjectUpdate', Gamefound.Components.Projects.ProjectUpdate, {"props":{"showContent":true,"update":{"userInfo":null,"abstract":"We are back with new photos of the red non-Sundrop castles and samples of the inserts!","content":"\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EHello Dukes \u0026amp; Duchesses!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003EAs promised back with more news about the red non-Sundrop castles that we\u0027ve shown lately. \u003Cb\u003EWe know that the photos we shared in our latest update didn\u0027t turn out as great as we had hoped, but we wanted to give you a sneak peek of the miniatures\u0027 colors before the PM deadline.\u003C/b\u003E Luckily, we\u0027ve just received a parcel with the samples from the factory, and our QA Team immediately checked them out and took some photos!\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EThe good news is that the red non-Sundrop castles look much better in person than they did in the low-quality photos we shared before\u003C/b\u003E. We\u0027ve taken some new pictures to show you the true color of the castles, but it\u0027s still not easy to capture the exact shade on camera. \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EThis is why we are posting below two versions of each picture taken in a different light so that you have the best possible overview of the color of the non-Sundrop castles. \u003C/b\u003ERest assured, though, that the castles are not as bright and toy-like as they may have appeared in the previous update. Below you can check out the photos of the samples that arrived at our office.\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/d781c464-4e14-4a74-b410-f309bb49b7c1.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/727be046-0e00-42c9-88d8-caa787362717.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/1b002e10-4a37-47b0-a06c-5b0ce215cbb3.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/3fed9acc-0fff-4875-b351-96f1f8a18456.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/bd3db685-1288-4fd2-81d9-5b55e2988337.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/7ce6a85c-7421-46bd-a0c6-55d10e52dbe1.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003EWe also wanted to apologize for not pointing out some important details about the red color of the castles earlier. We initially tried some solutions with more beige and tan colors, but after some testing, \u003Cb\u003Ewe found that the red/burgundy-ish color was the best option for gameplay. It\u0027s easier to distinguish, which makes the game more intuitive, and it was also better rated by testers. \u003C/b\u003EAdditionally, changing the castles\u0027 color from green (used in past versions) allowed us to avoid having three different shades of green in the game, as we already have livestock and Vineyard hexes in that color.\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/0720f323-e921-4f48-97db-f6c42de9b571.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EWe hope that these new pictures will help you make an informed decision about your pledge before the PM closes. \u003C/b\u003EWe also want to let you know that we\u0027ll continue to share new samples of other 3d Terrain Pack components as soon as we have them.\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003EWe\u0027ve heard questions about the inserts\u0027 design after our last update, and we wanted to address them. \u003Cb\u003EWe\u0027ve taken some pictures of the sample that just arrived at our office, and we want to share them with you. Please note that some of the components presented in the inserts, such as the Sundrop castles (or the number of bags), are former samples that we included just to show you how the space in the inserts will be used.\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/a5817144-c6f3-4404-b932-96cf177ab060.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/9f5668da-d1d1-4a00-8e65-6ab579127abc.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/c0cc2560-f307-4d06-a2a7-8346a1a0ae2f.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003EThat\u0027s all we have for today\u0027s update, but we\u0027ll keep you posted as soon as any new samples arrive!\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EIn the meantime we remind you that the Pledge Manager closes tomorrow \u2013 March 8th at 8 PM CET (Central European Time)!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EPLEASE REMEMBER that if your Gamefound account now shows the \u0022Paid, Awaiting PM\u0022 status, it ONLY means that the funds you pledged during the campaign have been taken from your credit card and NOTHING ELSE. You still have to provide us with your shipping and billing data and pay for the shipping of your pledge.\u003C/div\u003E\u003Cdiv\u003ESo please double-check if you have everything filled out in your Gamefound order so we can get all the crucial data.\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EPAID IN FULL is the proper status when you successfully finalize the pledge manager.\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003EThis means you managed to process through checkout, provide the shipment info, and process the shipment costs.\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EIf you have any doubts about your order, you can always contact our Customer Support here: \u003Ca href=\u0022https://support.awakenrealms.com/support/tickets/new\u0022 target=\u0022_blank\u0022 rel=\u0022nofollow noopener noreferrer     \u0022\u003Ehttps://support.awakenrealms.com/support/tickets/new\u003C/a\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003ETake care!\u003C/b\u003E\u003C/div\u003E","hasImage":true,"imageUrl":"https://imgcdn.gamefound.com/projectupdate/projects/1926/43f3d747-4b6a-489a-a760-b45a39185d8a.jpg","targetAudience":0,"targetUserGroupIDs":null,"projectUpdateUrl":null,"bulkNotificationID":null,"createdAt":"2023-03-07T17:54:40.057Z","imageFileName":"43f3d747-4b6a-489a-a760-b45a39185d8a.jpg","isPinned":false,"isPublished":true,"likesCount":179,"pollID":null,"projectID":1926,"projectUpdateID":4759,"publishedAt":"2023-03-07T18:00:11.347Z","sequenceNumber":28,"status":1,"title":"New photos of non-Sundrop castles / Inserts samples / The PM closes tomorrow \u2013 March 8th at 8 PM CET!","updatedAt":null},"isLoggedIn":false},"class":null});</script>
