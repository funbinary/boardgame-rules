<script>Gamefound.registerComponent('v-88c94d54-867b-4378-9247-e4cba9d285b3', 'Components.Projects.ProjectUpdate', Gamefound.Components.Projects.ProjectUpdate, {"props":{"showContent":true,"update":{"userInfo":null,"abstract":"This month we are back with some new component samples and the first photos straight from the factory!","content":"\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EHello Dukes \u0026amp; Duchesses!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003EWe are excited to share some updates on the game\u0027s production process. We have received new samples of acrylic and non-sundrop 3D tiles and are happy to present you with the results.\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EAcrylic hex tiles\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003ESo we have finally received all examples of the acrylic hex tiles \u2013 earlier, we asked the factory to correct the building and livestock (what we mentioned in update #25). And now, we can say that the tiles have quite a satisfying clarity and depth, making them nicely visible. They feel really good in the hand and look neat on the player boards! Below you can see some photos taken in our office this week.\u003Cb\u003E Please note that lighting conditions may affect color accuracy. Also, please be aware that the Vineyard depot is presented in the Sundrop version! :) \u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/786912f4-fe7d-41f6-a2c5-b7a999d54c8f.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/02ffd0d6-20dd-4a2a-ad70-b5a61bc502ef.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/62f840cf-2af0-4d47-9e26-1a33e98d2d2e.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/9c91538e-58f8-4735-b437-9a62289e4953.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/2544d5f7-e94a-422e-bc12-73891a0ee262.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/2f8af8f1-d903-4b5b-b310-95b9cc7ef301.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003ENon-sundrop 3d tiles\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003EWe have also received samples of the non-sundrop 3D tiles (we are still waiting for the Sundrop ones. Considering the former low-quality pics from the factory, we will wait to show them until they arrive at our office). And we must say they have a satisfying weight, are easy to distinguish, and we believe they will add a new level of enjoyment to the game.\u003Cb\u003E Our Dev team played a few rounds with those samples, and the table presence of the Special Edition of Castles of Burgundy with the 3D tiles really looks great! \u003C/b\u003ECheck out a few pictures below! \u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/68162537-68d2-41a2-b35c-cbd5dac8d8db.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/976a391e-2d9c-4ce0-8688-42bdcab429b4.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/d1b4c105-1e28-4d0f-8666-abb78fd11259.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/3b076448-6bcd-4cef-93f8-330f12dfcafe.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EPictures straight from production\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003ELast but not least, we have also received the first photos from the production process, and we are pleased to report that everything is running pretty nicely\u003C/b\u003E. We have also begun the inspection and quality control of the already produced components, and so far, we haven\u0027t encountered any deal-breaking issues. \u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/b8eca43a-152c-403d-87de-457de45ca7d6.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/f7ef028a-fc23-46b0-9639-3f47c7fe4bc2.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/e8eb364d-4296-494f-acb8-139222539125.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/2b430c1b-27d5-47d3-a8f3-5a189b16b93a.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/145668ad-9c4d-4411-b9ea-d37d2a363365.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/42732610-1861-483c-9054-0b4a11774c16.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/39187530-6523-46fe-9b37-abcb80b0897d.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/fd8b01b1-3a73-4b06-bc40-07c4742b70fc.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003EWe know that you have been eagerly anticipating the arrival of your copy of Castles of Burgundy Special Edition, and we want to assure you that we are working hard to get it to you as soon as possible. \u003Cb\u003EWe will continue to keep you updated on the progress of the production and the shipping process. In the upcoming update, we should be able to provide you with more exact information about how we will be picking up the containers and delivering them to specific hubs!\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EAlso, we are still waiting for the first mass-production copies to arrive at our office. Once that happens, you can expect us to publish an official unboxing video! :)\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EThank you for your support and patience, and we can\u0027t wait for you to see the final product.\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003ETake care!\u003C/b\u003E\u003C/div\u003E","hasImage":true,"imageUrl":"https://imgcdn.gamefound.com/projectupdate/projects/1926/4d881268-026e-4a62-a8f3-9e328a25b14a.jpg","targetAudience":0,"targetUserGroupIDs":null,"projectUpdateUrl":null,"bulkNotificationID":null,"createdAt":"2023-04-13T13:12:20.96Z","imageFileName":"4d881268-026e-4a62-a8f3-9e328a25b14a.jpg","isPinned":false,"isPublished":true,"likesCount":351,"pollID":null,"projectID":1926,"projectUpdateID":5243,"publishedAt":"2023-04-13T16:53:18.44Z","sequenceNumber":29,"status":1,"title":"Production update #2 / Samples of acrylic and non-sundrop 3d tiles!","updatedAt":null},"isLoggedIn":false},"class":null});</script>
