<script>Gamefound.registerComponent('v-d129bd12-f064-462f-9a51-0175848545c5', 'Components.Projects.ProjectUpdate', Gamefound.Components.Projects.ProjectUpdate, {"props":{"showContent":true,"update":{"userInfo":null,"abstract":"Time for our next BIG pre-campaign update, where we present the new layout of player boards and reveal that all Duchies will be included in the Core box! We will also announce the launch date of our crowdfunding campaign!","content":"\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EHello Dukes \u0026amp; Duchesses!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EWe are coming back with a BIG pre-campaign update before the start of our crowdfunding campaign! \u003C/span\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EToday we want to show you the first prototype of the new double-layered player board that we want to include in the core box! Beyond that, we also have some pretty good news about all the so far issued Duchy boards. And finally, today, we reveal the exact start date of our crowdfunding campaign!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAs you can see, there is quite a lot of stuff to talk about :) So, without further ado, let\u0027s get straight down to business.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EJust one last thing before we start with the mentioned topics. Thank you for taking part in our last poll regarding the view of the hex tiles :) It\u0027s good to see that players are interested in getting CoB truly royal robes! :) And of course, please be active here with us during the campaign because your opinion is important! And now, let\u0027s get back to the main topics of today\u0027s update.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EDouble-layered player boards\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EWhen we first started thinking about creating the Special Edition of Castles of Burgundy, it was evident to us that player boards are a component that can be significantly improved. \u003C/span\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAnd once we announced the draft page of this campaign, your comments only confirmed our belief that the new version is something that not only the game itself needs, but most of all, that you, fans of Castles, expect it!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ESo, throughout the last weeks, our designers and game testers developed various ideas and solutions, which they then tried out during playing the game. Our goal was to create such a player board that would really help players to organize the whole play and make their Duchies look really royal :) \u003C/span\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAnd today, we are happy to present you samples of a double-layered player board that we invented during dozens of iterations.\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/4852bd91-1c7f-435e-a0a0-9184cfbb0738.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/8e456912-5dbd-4847-8f64-0bb74066b8b6.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EPlease notice that all the parts you can see in the pictures are still WORK IN PROGRESS.\u003C/b\u003E The shape, artwork, or cutout spaces are not final and will still be polished and play tested. The final component that will go to the core box will be precisely designed to look genuinely royal :)\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EIt will have dedicated cutouts to fit the trade goods tiles and sold goods, workers, and coins. What is more, there will be 4 dice storage cutouts. Two where you will be able to put your rolled dice, and the next two where you will move your dice once they\u0027re used.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/71074350-0675-4161-9709-512a17bc57dd.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/f79f8245-9ef3-47f8-a7e5-da1778bc6eed.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EEach player board will also have a special place where you will put the Duchy boards \u003C/b\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E(you can read more about them in the dedicated chapter below!). \u003Cb\u003EAnd those boards will be covered by a removable player board overlay made from hard plastic to last for hundreds of gameplays. The overlay will also be transparent\u003C/b\u003E, so it won\u0027t interfere with the composition of the hex tiles that will create your Duchy. \u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/f5508b4a-5188-4976-973e-14111ca0de39.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EThanks to these improvements, the management of the player board will be easier and more orderly, which will make the game more enjoyable for all players. Also, the hex tiles will not rest loosely on the board and be exposed to any unexpected table movements ;) \u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAnd of course, everything will fit the new extended by 30% hex tiles that you could see during our previous pre-campaign updates :)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/6bab3977-a6c1-41af-8ef4-2de36faa6609.jpg\u0022\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;Additionally, thanks to the new graphic design of the player boards, \u003C/span\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003Eyou will be able to recognize the player\u0027s colors not only with the help of the dice they use but also thanks to a dedicated artwork of your Lord\u003C/span\u003E\u003C/b\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E that will be placed on the board in the space where players did store their used dice in the previous editions of the game.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EDuchy boards\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EWith the new design of the player boards, we decided to separate them from the Duchy boards.\u003C/b\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E This means that in the core box, you will find 4 double-layered player boards in which you will be placing the Duchy boards in the shape of a honeycomb. These boards will be printed on high-quality paper, and they will remain double-sided (with a different board on each side). And here is where the good stuff starts :)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EIn the Core box of the Special Edition of Castles of Burgundy, you will find all 26 Duchy boards officially issued so far!\u003C/b\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAdditionally, we will also include the boards for the team play and solo mode!\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EHowever, these specific boards (for team play and solo) will remain in the shape of a \u0022classic player board\u0022. Due to their particular shape, they can\u0027t fit the honeycomb space in the new double-layered player board. Of course, we will adapt them to match the Special version of the game. We will provide you with more information about the team play and solo boards later during the campaign.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ENow let\u0027s get back to the 26 Duchy boards cause we have one more important announcement to make! :) We saw this being a common request from you guys in the comment section. So, we sat down, discussed it, checked if it would fit the box, and made the final call. \u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EWe are happy to inform you that all of the mentioned 26 Duchy boards will come in four copies! So, in the Special Edition of Castles, you will be able to play against your friends competing with the same Duchy! This gives you 104 Duchy boards (52 double-sided, to be precise) in the Core box \u002B the team play and solo ones!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/b46ca3b1-d2a3-4c90-a681-2cc32de2404b.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EThanks to this, you will gain additional possibilities to play a highly-balanced game where all players have the same Duchy, so their strategy skills will play a crucial part :)\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EIt will also be possible to play in various combinations, which were not possible in previous versions, with only one piece of each board. \u003C/span\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ESo, who is planning a game night where your most experienced player will receive the most challenging Duchy, and the rest will play on board no.8? :D (btw. we will have a small announcement regarding the famous board number 8, but a bit later during the campaign :D)\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EThe launch date of the campaign!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ELast but not least, we are really excited to officially announce the campaign start date: 24th of May at 5 PM CEST!\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ESo, we are less than a week from the start!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EWe will be truly honored to have you all with us here during that special day! \u003C/span\u003E\u003Cb\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAnd we would be grateful if you could spread the word about the campaign as we have some pretty awesome Stretch Goals prepared that will make this Special Edition a real jewel in the crown :)\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EBefore the campaign starts we will be doing some adjustments to our crowdfunding page. So be sure to check it out from time to time and look for some new art, graphics, and many more! :)\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color:
