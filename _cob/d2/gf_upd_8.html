            }
            else {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
                else {
                    document.documentElement.setAttribute('data-theme', 'bright');
                }
            }
        })();
    </script>

    <script>App.registerComponent('v-1c0c94db-f364-4096-838d-c72f8f311fdc', 'App.Components.Projects.ProjectUpdateContent', App.Components.Projects.ProjectUpdateContent, {"props":{"navigation":{"backProjectUrl":null,"items":[{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Project","restrictionReason":null,"type":0,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Rewards","restrictionReason":null,"type":1,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/rewards"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Your pledge","restrictionReason":null,"type":2,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/yourpledge"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Comments","restrictionReason":"The creator hasn\u0027t enabled the comment section yet.","type":3,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/comments"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":true,"isRestricted":false,"name":"Updates","restrictionReason":"","type":4,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"FAQ","restrictionReason":"The creator hasn\u0027t enabled the FAQ section yet.","type":5,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/faq"}],"stretchGoalsUrl":null},"update":{"userInfo":null,"abstract":"Almost one week has passed since we started this campaign! After revealing the Vineyards of Burgundy expansion now, it\u0027s time for new Stretch Goals. Check out what we have prepared for today!","content":"\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EHello Dukes \u0026amp; Duchesses!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EOn day 7 of our campaign, it is time to unlock a new Stretch Goal! Today we will focus a bit more on existing components that will receive some upgrades that have been asked for by the community since a while ago! However, there will also be some new stuff that we will introduce with today\u0027s Stretch Goal ;) \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003ELet\u0027s start with Duchies #4 and #8\u003C/b\u003E, as these are the two that have been most often commented on by players as crashing the game\u0027s balance.\u003Cb\u003E Our Development team took them to the workshop and started testing different solutions that should fix the issues.\u003C/b\u003E After hundreds of plays, during which they were checking out various solutions, the balance was finally restored. \u003Cb\u003EThanks to the repositioning of some fields, the issues with Duchies #4 and #8 have been fixed. They now provide the possibility of more balanced and equal gameplay. Take a look at how they are designed right now!\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/cd7cbcde-1c77-4c58-9538-87360b29fd1d.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003EEspecially Duchy No. 8 stood out from the rest, allowing players to score higher average points. The statistics collected over the years confirm the inequalities. The changes made are to bring the Duchies mentioned above closer to the others. Of course, perfect balance is impossible and not even desired. Still, in these two cases, the impact on the gameplay was too significant.\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EOf course, the new versions (in four copies) will replace the former ones. It will be added to all the available pledges during this campaign.\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EAnd that\u0027s not everything we fixed. When we started the campaign, we were actually pleased when this idea came up in the comment section, as we have been already working on it for a while ;) \u003Cb\u003EMainly you asked in the comments to change the Monastery hex tile #6 :\u003C/b\u003E) Just a quick highlight for players not familiar with the whole case. This tile already had two different versions. One was in the first edition of CoB, and the second was provided in the Anniversary edition. And both of them have not gained recognition in the eyes of the players.\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EWhat is more, the effect of this hex presented in the Anniversary edition also had too much influence on the game. \u003Cb\u003ESo, Stefan Feld and our Dev Team considered reverting to the previous effect. Still, eventually, we decided together to add a whole new effect to the game. We hope it will be more balanced and bring a slight breeze of freshness to the game.\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/b848b8af-064e-4ad1-8c04-425ca0f257fc.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EIn the Special Edition of Castles of Burgundy, you will receive a new version of hex tile #6. Of course, it will be available in the standard cardboard version in all pledges and the Upgraded hex tiles add-on. \u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003ESo we presented you some fixes to the existing game components that we hope will even rebalance the game more and give a new life to Duchies that weren\u0027t your favorite ones ;) \u003Cb\u003ENow it\u0027s time to unlock some new stuff in today\u0027s Stretch Goal! We start by presenting another component designed by Stefan Feld himself!\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EDukes \u0026amp; Duchesses, we present you with \u003Cb\u003Etwo totally new and never published before Duchies!\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/28400452-36f0-4aaa-84ae-e2555a483ff2.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EThese two new Duchies will come in four copies precisely as the rest of the standard Duchies included in all the pledges.\u003C/b\u003E We had the opportunity to playtest them. They really add a good portion of replayability and a breath of new challenge to build a brand new Settlement! They are already tested, but we still have some more tests to do - we don\u0027t want to repeat the situation from Duchy #8 ;) \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003ELast but not least, we have one more thing to reveal today! With the Special Edition of CoB, you receive 16 3d miniatures of castles (they are not included in the Classic pledge). \u003Cb\u003EAnd today, we want to add one additional sculpt to that set!\u003C/b\u003E This means that now you will have two different types of miniatures instead of just the one we revealed at the beginning of our campaign. \u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/c6044a59-7bf1-40c0-aa6b-ed10da105cb1.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003EThis miniature was created in the hands of our talented 3d in-house artists. \u003Cb\u003EWhile creating this mini, they were inspired by the Ch\u00E2teau de la Rochepot.\u003C/b\u003E This is a 12th-century feudal castle of neo-Gothic-Burgundian style. In the 19th century, it was completely restored and covered with glazed burgundy tiles. And it is located in Burgundy ;) What is more, the castle many times changed its owner, and after one such change, Pinot noir grapes started being planted in its vicinity ;) \u003Cb\u003ESo not only it is a pure Burgundy castle, but it also connects thematically to the new Vineyard expansion prepared by Stefan Feld :)\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003EAnd that\u0027s all we prepared for today! Let us know in the comments what you think about the new Duchies and the ones that have been fixed! \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EAnd stay tuned as we will be back on Wednesday to unlock a new Stretch Goal :)\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003ETake care!\u0026nbsp;\u0026nbsp;\u003C/div\u003E","hasImage":true,"imageUrl":"https://imgcdn.gamefound.com/projectupdate/projects/1926/42ffd9ec-188a-4306-914e-45dc667d728c.jpg","targetAudience":0,"targetUserGroupIDs":null,"projectUpdateUrl":null,"previousUpdateUrl":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates/7","nextUpdateUrl":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates/9","bulkNotificationID":null,"createdAt":"2022-05-30T15:12:34.783Z","imageFileName":"42ffd9ec-188a-4306-914e-45dc667d728c.jpg","isPinned":false,"isPublished":true,"likesCount":296,"pollID":null,"projectID":1926,"projectUpdateID":2225,"publishedAt":"2022-05-30T16:19:18.32Z","sequenceNumber":8,"sendNotificationsForScheduledProjectUpdate":false,"status":1,"title":"Day 7: Two new Duchies and two rebalanced ones!","updatedAt":null},"isLoggedIn":false,"showComments":true,"comments":{"allowCreatorHidingComments":true,"commentThreadID":301,"hideCommentsOnMobile":false,"tag":null,"tagRedirectUrl":null,"showRecommendations":false,"showStreams":false,"layout":"default","loading":"lazy","canComment":false},"goBackUrl":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates","goBackLabel":"go back to updates","projectId":1926}});</script>
