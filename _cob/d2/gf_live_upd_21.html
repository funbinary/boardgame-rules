    <script>
        (function (){
            const localStorageValue = JSON.parse(localStorage.getItem('store.webTheme'));
            if (localStorageValue && localStorageValue.theme) {
                document.documentElement.setAttribute('data-theme', localStorageValue.theme);
            }
            else {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
                else {
                    document.documentElement.setAttribute('data-theme', 'bright');
                }
            }
        })();
    </script>

    <script>App.registerComponent('v-4b28bb2e-5e3f-44fb-878b-9f05e385ba8b', 'App.Components.Projects.ProjectUpdateContent', App.Components.Projects.ProjectUpdateContent, {"props":{"navigation":{"backProjectUrl":null,"items":[{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Project","restrictionReason":null,"type":0,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Rewards","restrictionReason":null,"type":1,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/rewards"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Your pledge","restrictionReason":null,"type":2,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/yourpledge"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"Comments","restrictionReason":"The creator hasn\u0027t enabled the comment section yet.","type":3,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/comments"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":true,"isRestricted":false,"name":"Updates","restrictionReason":"","type":4,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates"},{"adminLink":null,"adminLinkText":null,"canBypassRestriction":false,"badgeText":null,"isActive":false,"isRestricted":false,"name":"FAQ","restrictionReason":"The creator hasn\u0027t enabled the FAQ section yet.","type":5,"url":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/faq"}],"stretchGoalsUrl":null},"update":{"userInfo":null,"abstract":"Find more about the current status of the Special Edition project and learn more about some special CoB prototypes we have worked on throughout the last month.","content":"\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003EHello Dukes \u0026amp; Duchesses!\u003C/span\u003E\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EThis time we have a surprise for you! We kept it secret a bit, but we are ready to unveil the mystery right now!\u003C/b\u003E As we are getting closer and closer to the moment when we will be opening the Pledge Manager, we decided to provide you with something more than just renders or visualizations of the Special Edition components. \u003Cb\u003EBut before we get to the specifics of what we have been up to lately, let\u0027s start with some vital information.\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EFirstly, as mentioned above, we are preparing the PM to open. When will that happen exactly? Well, nothing is set in stone yet, but we aim to be ready within the next few weeks. Once everything is prepared, we will post an official update informing you that the PM is open. And no need to worry, as we plan to have it available for you guys for sure for more than a month.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003ESecondly, we would like to brief you on where we are currently in the development process :)\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ESo, we are on two parallel paths.\u003Cb\u003E The first one concerns all the 3d components such as Castles and other minis, Victory point markers, acrylic tokens, etc\u003C/b\u003E. Here we are currently working on some modifications and polishing the files. We assume that we should have the first PU samples available in the second half of October.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EThe second path focuses on all the paper components. And we are pretty done with all the files on our end\u003C/b\u003E. What exactly does this mean? Right now, we are printing our first internal drafts to be able to check if the colors are right, everything is in the right place, visible, and without any errors.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EYou can have a look at some pictures we did in our office this week during the internal checks ;)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003EPlease note that these are the very first samples, and the final version in terms of colors or graphics may vary from what you will see below!\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/7746338e-7d17-4d04-9f36-f6bc63a59910.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/eb6fff51-627b-4692-b898-cb79365dbe69.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/c1c22736-9bcc-4ab6-8652-88153c685c1d.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/39f28fbc-2558-4704-8672-4ca70029384a.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/d5e78025-3ca8-46a5-8913-f90f25d3ff37.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ESo, the next step, once we check the drafts, is to start sending files to the factory and running another round of tests of the final files that will be printed once they are accepted.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAll in all, we are proceeding as planned, but there are still some necessary steps we need to pass before mass production starts. \u003Cb\u003EOnce we are a bit further in the final check and acceptance, we will share a detailed production timeline with you guys!\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003ESpecial Edition of Castles of Burgundy prototypes!\u003C/span\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAnd now it\u0027s time to unveil the surprise we mentioned at the beginning. \u003Cb\u003EWe decide to cast a few prototypes of the Special Edition of Castles of Burgundy and ship it to board game Reviewers! :)\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EOnce we are closer to the PM opening, you can expect some preview videos to pop up on YouTube ;)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EWe hope this will help you make an informative decision on what pledge level to select or join the royal party with the Late Pledge option! \u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EWe won\u0027t spoil too many details today, but here is some helpful information. \u003Cb\u003EIn the prototype box, we included the Vineyards expansion and two of the brand new Duchy boards we revealed during the campaign. Inside there are also the new double-layered player boards and the main board.\u003C/b\u003E However, we need to report that the new solo mode (Automa) is not a part of the prototype. As mentioned, \u003Cb\u003Eall the components are still a Work in Progress\u003C/b\u003E. They will likely differ in colors, graphics, or design from the mass production version. However, we thought that creating such prototypes would be a nice feature and a nod to undecided backers.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ESo, we hope you will like what you see once the video content is prepared by the Reviewers ;) In the meantime, we have a few photos of the prototypes we would like to share with you! Check them out!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/60e0fa19-449f-4eba-81af-ace178dfbe0d.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/de97edb4-a5fc-45c0-9715-ac58dba93ca0.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/a9984a06-d246-42ff-b549-c4e9d133fcff.jpg\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/4213be06-1cd5-4900-8a2e-e1cce3c4dd9c.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/5ed2d7df-026e-4037-b69f-769741722adf.jpg\u0022\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003ETainted Grail: Kings of Ruin is live on Gamefound!\u0026nbsp;\u003C/span\u003E\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EBefore we reach the end of today\u0027s update, we got one more announcement to make :) Yesterday, on the 27th of September, to be precise, we launched a new campaign on Gamefound!\u0026nbsp;\u003C/span\u003E\u003Ca href=\u0022https://gamefound.com/projects/awaken-realms/tainted-grail-kings-of-ruin\u0022\u003E\u003Cspan style=\u0022color: rgba(74, 110, 224, 1)\u0022\u003E\u003Cb\u003ETainted Grail: Kings of Ruin is a new standalone adventure by the creators of the original Tainted Grail.\u003C/b\u003E\u003C/span\u003E\u003C/a\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u0026nbsp;Returning to Avalon, in its western part, you will discover secrets of Claudyne the Unknighted, Amberqueen Vendeda, and Nonus, Bishop of the Deep!\u0026nbsp;\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ca href=\u0022https://gamefound.com/projects/awaken-realms/tainted-grail-kings-of-ruin\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/9e61b63f-1cec-4a67-a215-9c97f3733996.png\u0022\u003E\u003C/a\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003E\u003Cb\u003EKings of Ruin is a fully standalone, new Tainted Grail adventure\u003C/b\u003E. It offers a deep, dark story enhanced with gameplay that focuses on adventure, exploration, combat, and diplomacy \u2013 a fully-fledged Board Game RPG experience in a box! In this 1-4 player cooperative game, you will travel through a forgotten part of Avalon and discover the secrets of Kings of Ruin.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EIn this new crowdfunding campaign, you also have access to all previous Tainted Grail content in an updated 2.0 version, as well as a special budget Update Pack for owners of previous editions!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ca href=\u0022https://gamefound.com/projects/awaken-realms/tainted-grail-kings-of-ruin\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/e6fc1e77-f7b0-486f-a8cc-a903d95f74ff.png\u0022\u003E\u003C/a\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EAnd that\u0027s all for today!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003EStay aware and look out for some Special Edition preview videos a few weeks from now :)\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(14, 16, 26, 1)\u0022\u003ETake care!\u003C/span\u003E\u003C/div\u003E","hasImage":true,"imageUrl":"https://imgcdn.gamefound.com/projectupdate/projects/1926/da14d1a1-2f79-4727-88ef-45263bde493c.jpg","targetAudience":0,"targetUserGroupIDs":null,"projectUpdateUrl":null,"previousUpdateUrl":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates/20","nextUpdateUrl":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates/22","bulkNotificationID":null,"createdAt":"2022-09-28T13:26:45.697Z","imageFileName":"da14d1a1-2f79-4727-88ef-45263bde493c.jpg","isPinned":false,"isPublished":true,"likesCount":116,"pollID":null,"projectID":1926,"projectUpdateID":3258,"publishedAt":"2022-09-28T17:09:41.877Z","sequenceNumber":21,"sendNotificationsForScheduledProjectUpdate":false,"status":1,"title":"Development update #2 / We are crafting Special Edition prototypes!","updatedAt":null},"isLoggedIn":false,"showComments":true,"comments":{"allowCreatorHidingComments":true,"commentThreadID":916,"hideCommentsOnMobile":false,"tag":null,"tagRedirectUrl":null,"showRecommendations":false,"showStreams":false,"layout":"default","loading":"lazy","canComment":false},"goBackUrl":"/en/projects/awaken-realms/castles-of-burgundy-special-edition/updates","goBackLabel":"go back to updates","projectId":1926}});</script>
