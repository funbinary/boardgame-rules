name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  SERVER: root@101.34.252.34
  # 服务器 ED25519 主机指纹（固定下来，防止 keyscan 被劫持）
  HOST_KEY_FP: SHA256:KBTITL08BAObIwNTj2s/R0hQAgsvy1ekGUeVS5xhT1M

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 101.34.252.34 > ~/.ssh/known_hosts 2>/dev/null
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')"
          if [ "$actual" != "$HOST_KEY_FP" ]; then
            echo "::error::主机指纹不匹配（期望 $HOST_KEY_FP，实际 $actual）"
            exit 1
          fi

      - name: 交叉编译 rules-api（linux/amd64）
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: |
          cd server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o /tmp/rules-api ./cmd/rules-api

      - name: 部署静态站到 /var/www/rules
        run: |
          ssh "$SERVER" "mkdir -p /var/www/rules"
          if ssh "$SERVER" "command -v rsync" > /dev/null 2>&1; then
            echo ">> rsync 增量同步（--delete 清除残留）"
            rsync -az --delete \
              --exclude='.git/' \
              --exclude='server/' \
              --stats ./ "$SERVER":/var/www/rules/
          else
            echo ">> tar 全量同步（先清空目录）"
            tar --exclude='./.git' --exclude='./server' -czf - . \
              | ssh "$SERVER" "find /var/www/rules -mindepth 1 -delete && tar -xzf - -C /var/www/rules"
          fi

      - name: 发布 rules-api 二进制并重启服务
        run: |
          ssh "$SERVER" "mkdir -p /opt/rules-api/data"
          scp -q /tmp/rules-api "$SERVER":/opt/rules-api/rules-api.new
          ssh "$SERVER" "chmod +x /opt/rules-api/rules-api.new && mv /opt/rules-api/rules-api.new /opt/rules-api/rules-api"
          # systemd 单元幂等安装（server/ 不进 webroot，单元内容内联在这里维护）
          ssh "$SERVER" 'cat > /etc/systemd/system/rules-api.service << "UNIT"
          [Unit]
          Description=rules-api — 桌游规则书用户与收藏服务
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/rules-api
          ExecStart=/opt/rules-api/rules-api
          Environment=ADDR=127.0.0.1:8787
          Environment=DB_PATH=/opt/rules-api/data/rules.db
          Environment=COOKIE_SECURE=1
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=full
          ReadWritePaths=/opt/rules-api/data

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload && systemctl enable rules-api >/dev/null && systemctl restart rules-api'

      - name: 验证站点与 API
        run: |
          sleep 2
          # 2026-09-11 备案通过后已上 HTTPS：certbot 将纯 IP 的 80 端口请求改为 404，
          # 验证必须走域名（HTTP 会 301 到 HTTPS）
          status="$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://zhibinai.cn/)"
          echo "站点 HTTP $status"
          [ "$status" = "200" ]
          health="$(curl -s --max-time 20 https://zhibinai.cn/api/health)"
          echo "API $health"
          echo "$health" | grep -q '"ok":true'
